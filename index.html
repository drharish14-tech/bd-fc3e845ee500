<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="dash-version" content="v7">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Halo">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
<title>Halo · Bot Dashboard</title>
<style>
:root{--bg:#0c0d0f;--side:#111214;--card:#16181b;--card2:#1c1f23;--line:#24272c;--line2:#2e3238;--t1:#eceef1;--t2:#a4a9b1;--t3:#6c727b;--green:#3ecf8e;--amber:#f2b53d;--blue:#5b9dff;--red:#f0787a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:272px;flex:0 0 272px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}.ws .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b9dff,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:700}
.ws b{font-size:14.5px}.ws small{display:block;color:var(--t3);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--t2);font-size:13.5px}.nav:hover,.nav.on{background:#1b1d21;color:var(--t1)}.nav .c{margin-left:auto;background:#24304a;color:#9cc0ff;border-radius:99px;font-size:11px;padding:0 7px}
.sh{display:flex;justify-content:space-between;color:var(--t3);font-size:11.5px;font-weight:600;letter-spacing:.02em;margin:18px 8px 6px}
.mem{display:flex;gap:10px;padding:7px 8px;border-radius:9px;align-items:flex-start}.mem:hover,.mem.on{background:#1b1d21}
.mem .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}.mem .act{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--side)}
.st{font-size:10.5px;border-radius:99px;padding:0 7px;font-weight:600;white-space:nowrap}
.st.Working{background:#12321f;color:var(--green)}.st.Idle{background:#212328;color:var(--t3)}.st.W{background:#3a2c0e;color:var(--amber)}
.proj{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--t2);font-size:13.5px}.proj:hover,.proj.on{background:#1b1d21;color:var(--t1)}.proj .c{margin-left:auto;color:var(--t3);font-size:11.5px}
main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,13,15,.86);backdrop-filter:blur(14px);z-index:20;padding-top:max(12px,env(safe-area-inset-top))}
.top .t{font-weight:600}.top .when{margin-left:auto;color:var(--t3);font-size:12px}.ham{display:none;background:none;border:0;font-size:20px;padding:4px 6px}
.wrap{max-width:820px;margin:0 auto;padding:28px 28px 60px}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 6px;font-weight:650}.lead{color:var(--t2);font-size:15px;margin:0}
.strip{display:none;gap:12px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .s{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--t2);min-width:58px;background:none;border:0}
.filt{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:#1b2333;color:#9cc0ff;border:1px solid #2a3a57;border-radius:99px;padding:3px 10px;font-size:12px}
.lbl{color:var(--t3);font-size:12.5px;font-weight:600;margin:30px 0 10px;display:flex;justify-content:space-between;align-items:center}
.lbl a,.lnk{color:var(--t2);font-weight:500;font-size:12.5px;background:none;border:0;padding:0;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.nh .bn{font-weight:600}.nh .ti{color:var(--t2)}.nh .ago{color:var(--t3);font-size:12px}.nh .sk{margin-left:auto;display:flex;gap:6px}
.of{color:var(--t3);font-size:12px;margin:10px 0 6px}
.ask{font-weight:600;font-size:15px;margin:0 0 12px}
.draft{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;color:#d6d9de;font-size:13.5px}
.draft .dl{display:block;color:var(--t3);font-size:11.5px;font-weight:600;margin-bottom:6px;white-space:normal}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.b{min-height:36px;border-radius:10px;padding:6px 14px;border:1px solid var(--line2);background:#1d2024;font-size:13px;font-weight:600}
.b.pri{background:var(--t1);color:#111;border-color:var(--t1)}.b.ghost{background:none;border:0;color:var(--t2);font-weight:500}
.b.sm{min-height:30px;padding:3px 10px;font-size:12px;border-radius:8px}
.menu{position:relative}.mpop{position:absolute;right:0;bottom:40px;background:#1d2024;border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:150px;z-index:30;box-shadow:0 10px 30px #000a}
.mpop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:13px}.mpop button:hover{background:#262a30}
.note{width:100%;margin-top:10px;background:#101215;color:var(--t1);border:1px solid var(--line2);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;min-height:70px}
.uv{color:var(--amber);font-size:11px;border:1px solid #4a3a16;border-radius:99px;padding:0 6px}
.pend{color:#8db8ff;font-size:12px;border:1px solid #2a3f63;border-radius:99px;padding:2px 9px}
.feed .r{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid #1c1f23}.feed .r:last-child{border-bottom:0}
.feed .x{flex:1;min-width:0;color:var(--t2)}.feed .x b{color:var(--t1);font-weight:600}.feed .x em{font-style:normal;color:var(--t1)}
.feed .tm{color:var(--t3);font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;background:#121417;border:1px solid var(--line);border-radius:10px;padding:3px;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--t2);font-size:12.5px;padding:5px 11px;border-radius:7px;white-space:nowrap}.tabs button.on{background:#262a30;color:var(--t1)}
select{background:#121417;color:var(--t1);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:inherit;font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.bar .tabs{flex:1;min-width:0}
.dh{font-weight:600;font-size:12.5px;color:var(--t2);padding:12px 0 4px}
.rt .r{display:flex;gap:14px;align-items:center;padding:9px 2px;border-bottom:1px solid #1c1f23}.rt .r:last-child{border-bottom:0}
.rt .tm{width:76px;color:var(--t3);font-size:12.5px;flex:0 0 76px}.rt .nm{flex:1;font-weight:500}.rt .ow{display:flex;gap:6px;align-items:center;color:var(--t2);font-size:12.5px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col h3{margin:0 0 8px;font-size:13px;color:var(--t2);display:flex;gap:8px;align-items:center}.cnt{background:#24272c;color:var(--t2);border-radius:99px;padding:0 7px;font-size:11px}
.tk{display:flex;gap:10px;padding:10px;border:1px solid var(--line);background:var(--card2);border-radius:12px;margin-bottom:8px}.tk .tt{font-size:13px}.tk .mt{font-size:11.5px;color:var(--t3)}
.detail{margin-top:18px}.dhd{display:flex;gap:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2328;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 10px 30px #000a}
.foot{color:var(--t3);font-size:12px;margin-top:30px;text-align:center}
.lock{max-width:360px;margin:22vh auto;text-align:center;color:var(--t2)}
.scrim{display:none}
@media(max-width:900px){
 aside{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s;box-shadow:20px 0 40px #000a;padding-top:max(16px,env(safe-area-inset-top))}
 body.open aside{transform:none}body.open .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:40}
 .ham{display:block}.top{padding-left:14px;padding-right:14px}.wrap{padding:18px 16px 50px}.strip{display:flex}
 h1{font-size:24px}.board{grid-template-columns:1fr}.card{padding:14px}
}
</style></head><body><div id="root"></div><div class="scrim" onclick="document.body.classList.remove('open')"></div>
<script>
const PAL=["#5b9dff","#a78bfa","#3ecf8e","#f472b6","#f2b53d","#60a5fa","#fb7185","#2dd4bf","#f97316","#c084fc"];
const TO="harish+dash@mail.grokbot.com";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function load(){const k=new URLSearchParams(location.hash.slice(1)).get("k");if(!k)return null;
 const enc=await(await fetch("data.enc.json?"+Date.now(),{cache:"no-store"})).json();
 const key=await crypto.subtle.importKey("raw",b64(k.replace(/-/g,"+").replace(/_/g,"/")),"AES-GCM",false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct))));}
let D,S={view:'home',proj:null,bot:null,ni:0,menu:null,open:null,all:false,day:"all",fbot:"all"};
// IST helpers: timestamps are IST wall-clock strings
const istNow=()=>new Date(Date.now()+(330+new Date().getTimezoneOffset())*60000);
const P=s=>{const [d,t]=s.split("T");const [y,m,dd]=d.split("-").map(Number);const [h,mi]=t.split(":").map(Number);return new Date(y,m-1,dd,h,mi)};
const ago=s=>{if(!s)return"";const m=Math.max(0,Math.round((istNow()-P(s))/60000));if(m<1)return"now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<24)return h+"h ago";return Math.round(h/24)+"d ago"};
const hm=s=>P(s).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const dkey=s=>s.slice(0,10);const todayKey=()=>{const n=istNow();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`};
const dlabel=k=>{const t=todayKey();const y=new Date(P(t+"T00:00")-864e5);const yk=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;const dt=P(k+"T00:00");const nm=dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});return k===t?"Today · "+nm:k===yk?"Yesterday · "+nm:nm};
const B=b=>D.bots[b]||{icon:"•",color:0,project:[],status:"Idle",activity:""};
const col=b=>PAL[B(b).color%PAL.length];
const av=(b,s,dot)=>{const st=B(b).status;const dc=st==="Working"?"var(--green)":st==="Idle"?"#555b63":"var(--amber)";return `<div class="av" style="width:${s}px;height:${s}px;background:${col(b)}22;box-shadow:inset 0 0 0 1.5px ${col(b)};font-size:${Math.round(s*.5)}px">${B(b).icon}${dot?`<i class="dot" style="background:${dc}"></i>`:""}</div>`};
const stp=st=>`<span class="st ${st==="Waiting on you"?"W":st}">${st}</span>`;
const okP=x=>!S.proj||x.project===S.proj||(!x.project&&B(x.bot).project.includes(S.proj)&&x.bot!=="Grok Bot");
const okB=x=>!S.bot||x.bot===S.bot;
const ok=x=>okP(x)&&okB(x);
function pend(){try{const m=JSON.parse(localStorage.getItem("pend2")||"{}");return m.v===D.dataVersion?m:{v:D.dataVersion,items:{}}}catch(e){return{v:D.dataVersion,items:{}}}}
function act(id,action){const it=[...D.waiting,...D.inProgress].find(x=>x.id===id);if(!it)return;
 const ta=document.getElementById("n-"+id);const note=ta?ta.value.trim():"";
 const body=`Item: ${it.id}\nTitle: ${it.title}\nBot: ${it.bot}\nAction: ${action}\nNote: ${note||"-"}\n\n(Sent from Halo dashboard)`;
 const m=pend();m.items[id]=action;localStorage.setItem("pend2",JSON.stringify(m));S.open=null;S.menu=null;R();
 const t=document.createElement("div");t.className="toast";t.textContent="Sent — I'll confirm in Grok Bot chat";document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
 window.location.href=`mailto:${TO}?subject=${encodeURIComponent("DASH: "+action+" "+it.id)}&body=${encodeURIComponent(body)}`;}
const rcp=x=>(x.receipts||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${x.receipts.map(r=>`<a href="${/^https?:/.test(r.href)?esc(r.href):'#'}" target="_blank" rel="noopener" style="font-size:11.5px;color:#9cc0ff;border:1px solid #2a3a57;border-radius:99px;padding:1px 8px;text-decoration:none" title="${esc(r.href)}">🧾 ${esc(r.label||'receipt')}</a>`).join('')}</div>`:'';
const set=o=>{Object.assign(S,o);R()};
function greet(){const h=istNow().getHours();return h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"}
function R(){
 const bots=Object.keys(D.bots);const pm=pend().items;
 const W=D.waiting.filter(ok);const cur=W.length?W[S.ni%W.length]:null;
 const working=bots.filter(b=>B(b).status==="Working"&&(!S.proj||B(b).project.includes(S.proj)));
 const tk=todayKey();const doneToday=D.finished.filter(f=>dkey(f.at)===tk).length;
 const names=working.length?working.length===1?working[0]:working.slice(0,-1).join(", ")+" and "+working.slice(-1):"No bots";
 const feedToday=D.timeline.filter(e=>ok(e)&&dkey(e.at)===tk);
 const feedAll=D.timeline.filter(e=>ok(e)&&(S.day==="all"||dkey(e.at)===S.day)&&(S.fbot==="all"||e.bot===S.fbot));
 const days=[...new Set(D.timeline.map(e=>dkey(e.at)))].slice(0,5);
 const pc=p=>D.waiting.filter(x=>x.project===p).length+D.inProgress.filter(x=>x.project===p).length;
 const verb=v=>v==="asked"?"asked":v==="started"?"started":v==="failed"?"failed":"completed";
 const feedRow=e=>`<div class="r">${av(e.bot,24)}<div class="x"><b>${esc(e.bot)}</b> ${verb(e.verb)} <em>${esc(e.text)}</em>${rcp(e)}</div><span class="tm">${S.all?hm(e.at):ago(e.at)}</span></div>`;
 const menuBtns=id=>`<div class="mpop"><button onclick="act('${id}','Snooze 1 day')">⏰ Snooze 1 day</button><button onclick="act('${id}','Snooze 3 days')">⏰ Snooze 3 days</button><button onclick="act('${id}','Dismiss')" style="color:var(--red)">✕ Dismiss</button></div>`;
 const needs=cur?`<div class="card">
   <div class="nh">${av(cur.bot,26,1)}<span class="bn">${esc(cur.bot)}</span><span class="ti">${esc(cur.title)}</span><span class="ago">${cur.at?(cur.timeApprox?"~":"")+ago(cur.at):""}</span>${cur.verified?"":`<span class="uv">unverified</span>`}
   <span class="sk"><button class="b ghost sm" onclick="set({ni:(S.ni+W.length-1)%W.length,open:null,menu:null})">‹</button><button class="b ghost sm" onclick="set({ni:S.ni+1,open:null,menu:null})">Skip ›</button></span></div>
   <div class="of">${S.ni%W.length+1} of ${W.length}${cur.due?` · <span style="color:var(--amber)">Due ${esc(cur.due)}</span>`:""}</div>
   <p class="ask">${esc(cur.ask)}</p>
   ${cur.draft?`<div class="draft"><span class="dl">${esc(cur.draftLabel)}</span>${esc(cur.draft)}</div>`:""}
   ${pm[cur.id]?`<div class="btns"><span class="pend">⏳ Pending: ${esc(pm[cur.id])}</span></div>`:`
   ${S.open===cur.id?`<textarea class="note" id="n-${cur.id}" placeholder="What should ${esc(cur.bot)} change?"></textarea>`:""}
   <div class="btns">
    ${S.open===cur.id?`<button class="b pri" onclick="act('${cur.id}','Request changes')">Send to ${esc(cur.bot)}</button><button class="b" onclick="set({open:null})">Cancel</button>`:
    `<button class="b pri" onclick="act('${cur.id}','Approve')">✓ Approve</button><button class="b" onclick="set({open:'${cur.id}'})">Request changes</button><button class="b ghost" onclick="act('${cur.id}','Discuss')">Discuss with ${esc(cur.bot)}</button>
    <span class="menu" style="margin-left:auto"><button class="b ghost" onclick="set({menu:S.menu==='${cur.id}'?null:'${cur.id}'})">•••</button>${S.menu===cur.id?menuBtns(cur.id):""}</span>`}
   </div>`}
  </div>`:`<div class="card" style="color:var(--t2)">Nothing needs you here.</div>`;
 const allAct=S.all?`<div class="card" style="margin-top:10px"><div class="bar"><div class="tabs">${[["all","All"],...days.map(k=>[k,dlabel(k).split(" · ")[0]==="Today"||dlabel(k).startsWith("Yesterday")?dlabel(k).split(" · ")[0]:dlabel(k)])].map(([v,l])=>`<button class="${S.day===v?"on":""}" onclick="set({day:'${v}'})">${esc(l)}</button>`).join("")}</div>
   <select onchange="set({fbot:this.value})"><option value="all">All bots</option>${bots.map(b=>`<option ${S.fbot===b?"selected":""}>${esc(b)}</option>`).join("")}</select></div>
   <div class="feed">${[...new Set(feedAll.map(e=>dkey(e.at)))].map(k=>`<div class="dh">${esc(dlabel(k))}</div>${feedAll.filter(e=>dkey(e.at)===k).map(feedRow).join("")}`).join("")}</div><div style="color:var(--t3);font-size:11.5px;margin-top:8px">Times in IST.</div></div>`:"";
 const routines=D.routinesToday.filter(r=>!S.bot||r.bot===S.bot);
 const IP=D.inProgress.filter(ok),FN=D.finished.filter(ok);
 const tkCard=(x,fin)=>`<div class="tk">${av(x.bot,24)}<div style="flex:1;min-width:0"><div class="tt">${fin?"✓ ":""}${esc(x.title)}</div><div class="mt">${esc(x.bot)} · ${ago(x.at)}</div>${fin?rcp(x):""}
   ${!fin?(pm[x.id]?`<div style="margin-top:6px"><span class="pend">⏳ Pending</span></div>`:S.open===x.id?`<textarea class="note" id="n-${x.id}" placeholder="Ask ${esc(x.bot)}…"></textarea><div class="btns"><button class="b pri sm" onclick="act('${x.id}','Ask bot')">Send</button><button class="b sm" onclick="set({open:null})">Cancel</button></div>`:`<div style="margin-top:6px"><button class="b sm" onclick="set({open:'${x.id}'})">💬 Ask bot</button></div>`):""}</div></div>`;
 const detail=S.bot?(()=>{const b=S.bot,x=B(b);return `<div class="card detail"><div class="dhd">${av(b,44,1)}<div><div style="font-weight:650;font-size:17px">${esc(b)} ${stp(x.status)}</div><div style="color:var(--t2);font-size:13px">${esc(x.activity)}</div></div><button class="b sm" style="margin-left:auto" onclick="set({bot:null,ni:0})">✕ Close</button></div>
   <div class="lbl" style="margin-top:16px">Recent activity</div><div class="feed">${D.timeline.filter(e=>e.bot===b).slice(0,8).map(feedRow).join("")||'<div style="color:var(--t3)">No recent activity.</div>'}</div></div>`})():"";
 document.getElementById("root").innerHTML=`<div class="app">
 <aside>
  <div class="ws"><div class="lg">H</div><div><b>${esc(D.workspace)}</b><small>Harish's bots</small></div></div>
  <div class="nav ${!S.proj&&!S.bot?"on":""}" onclick="set({view:'home',proj:null,bot:null,ni:0});document.body.classList.remove('open')">🏠 Home<span class="c">${D.waiting.length}</span></div>
  <div class="nav ${S.view==='routines'?"on":""}" onclick="set({view:'routines',bot:null});document.body.classList.remove('open');scrollTo(0,0)">🔁 Routines<span class="c" style="background:#222;color:var(--t3)">${(D.routinesToday||[]).length+(D.routinesWeekly||[]).length}</span></div>
  <div class="sh"><span>Your squad</span><span>${bots.length}</span></div>
  ${bots.map(b=>`<div class="mem ${S.bot===b?"on":""}" onclick="set({view:'home',bot:'${esc(b)}',ni:0});document.body.classList.remove('open');scrollTo(0,0)">${av(b,30,1)}<div style="min-width:0;flex:1"><div class="nm">${esc(b)} ${stp(B(b).status)}</div><div class="act">${esc(B(b).activity)}</div></div></div>`).join("")}
  <div class="sh"><span>Projects</span></div>
  ${D.projects.map(p=>`<div class="proj ${S.proj===p?"on":""}" onclick="set({proj:S.proj==='${esc(p)}'?null:'${esc(p)}',bot:null,ni:0});document.body.classList.remove('open')">📁 ${esc(p)}<span class="c">${pc(p)||""}</span></div>`).join("")}
  <div style="color:var(--t3);font-size:11px;margin:20px 8px 0">Quiet this week: ${esc(D.idleChecked.join(", "))}.</div>
 </aside>
 <main>
  <div class="top"><button class="ham" onclick="document.body.classList.add('open')">☰</button><span class="t">${S.view==='routines'?"Routines":S.bot?esc(S.bot):S.proj?esc(S.proj):"Home"}</span><span class="when">Updated ${hm(D.lastUpdated)} IST</span></div>
  <div class="wrap">
   <div class="strip">${bots.map(b=>`<button class="s" onclick="set({bot:S.bot==='${esc(b)}'?null:'${esc(b)}',ni:0})">${av(b,40,1)}<span>${esc(b.split(" ").slice(-1)[0])}</span></button>`).join("")}</div>
${S.view==='routines'?`<h1>Routines</h1><p class="lead">What repeats, who owns it, and how its last run went.</p>
   <div class="lbl">Daily and today</div><div class="card rt">${(D.routinesToday||[]).map(r=>`<div class="r"><span class="tm">${esc(r.time)}</span><span class="nm">${esc(r.name)}${r.freq?`<span style="color:var(--t3);font-size:11.5px;font-weight:400"> · ${esc(r.freq)}</span>`:""}<div style="font-size:11.5px;color:${r.result==='failed'?'var(--red)':'var(--t3)'};font-weight:400">${r.lastRun?`Last run ${ago(r.lastRun)} · ${esc(r.result)}${r.note?' · '+esc(r.note):''}`:'No run reported yet'}</div></span><span class="ow">${av(r.bot,20)}${esc(r.bot)}</span></div>`).join("")}</div>
   <div class="lbl">Weekly and periodic</div><div class="card rt">${(D.routinesWeekly||[]).map(r=>`<div class="r"><span class="tm">${esc(r.time)}</span><span class="nm">${esc(r.name)}</span><span class="ow">${av(r.bot,20)}${esc(r.bot)}</span></div>`).join("")}</div>
   <div class="foot">Bots report runs with halo-log routine. Updated ${hm(D.lastUpdated)} IST.</div>`:`
   ${S.proj||S.bot?`<div class="filt">Filtered: ${esc(S.bot||S.proj)} <button class="b ghost sm" style="min-height:0;padding:0" onclick="set({proj:null,bot:null,ni:0})">✕</button></div>`:""}
   ${detail}
   ${S.bot?"":`<h1>${greet()}, ${esc(D.user)}</h1>
   <p class="lead">${esc(names)} ${working.length===1?"is":"are"} working, and ${W.length} thing${W.length===1?"":"s"} need${W.length===1?"s":""} you. Your bots finished ${doneToday} task${doneToday===1?"":"s"} today.</p>`}
   <div class="lbl">Needs you <span style="font-weight:500">${W.length}</span></div>${needs}
   <div class="lbl">Today so far</div><div class="card feed">${feedToday.map(feedRow).join("")||'<div style="color:var(--t3)">Nothing yet today.</div>'}</div>
   <div style="margin-top:8px"><button class="lnk" onclick="set({all:!S.all})">${S.all?"Hide activity ▴":"See all activity ▾"}</button></div>${allAct}
   ${routines.length?`<div class="lbl">Today's routines</div><div class="card rt">${routines.map(r=>`<div class="r"><span class="tm">${esc(r.time)}</span><span class="nm">${esc(r.name)}${r.freq?`<span style="color:var(--t3);font-size:11.5px;font-weight:400"> · ${esc(r.freq)}</span>`:""}</span><span class="ow">${av(r.bot,20)}${esc(r.bot)}</span></div>`).join("")}
     <div class="dh" style="padding-top:14px">This week</div>${D.routinesWeekly.filter(r=>!S.bot||r.bot===S.bot).map(r=>`<div class="r"><span class="tm">${esc(r.time)}</span><span class="nm">${esc(r.name)}</span><span class="ow">${av(r.bot,20)}${esc(r.bot)}</span></div>`).join("")}</div>`:""}
   <div class="lbl">Tasks</div>
   <div class="board"><div class="col"><h3>In progress <span class="cnt">${IP.length}</span></h3>${IP.map(x=>tkCard(x,0)).join("")}</div>
   <div class="col"><h3>Finished <span class="cnt">${FN.length}</span></h3>${FN.map(x=>tkCard(x,1)).join("")}</div></div>
   <div class="foot">Halo · data as of ${esc(D.lastUpdated.replace("T"," "))} IST · actions open Mail, nothing is sent without you</div>`}
  </div></main></div>`;
}
load().then(d=>{if(!d)throw 0;D=d;R();
 setInterval(async()=>{try{const n=await load();if(n&&n.dataVersion!==D.dataVersion){D=n;const a=document.activeElement;if(!(a&&a.tagName==='TEXTAREA'))R()}}catch(e){}},60000);
}).catch(()=>{document.getElementById("root").innerHTML='<div class="lock">🔒<br>This dashboard needs its private link.</div>'});
</script></body></html>
